aid: figures
name: Figures
description: >-
  Figures is a European compensation management and pay transparency platform
  that helps HR teams and managers make strategic salary decisions using
  real-time market data. It combines salary benchmarking across 3.5M+
  datapoints, dynamic salary bands, collaborative compensation review
  workflows, and pay equity analysis, with modules built for the EU Pay
  Transparency Directive. Figures connects to 30+ HRIS and performance-review
  systems to enrich internal pay data, and is used by organizations including
  KPMG, EY, Qonto, and TotalEnergies. It is backed by Point Nine and Seedcamp.
  This profile was added to the API Evangelist network as a portfolio lead and
  enriched by the pipeline; Figures does not publish a public developer API.
